// Formats an APA citation so only the journal name is italicized.
// Splits on (YYYY). to separate authors from the rest, then title from journal.
function formatCitation(citation) {
  const m = citation.match(/^(.*?\(\d{4}\)\. )(.*?\. )(.*)$/);
  if (!m) return <span>{citation}</span>;
  const authorsYear = m[1];
  const articleTitle = m[2];
  const remainder = m[3];
  const commaIdx = remainder.indexOf(',');
  if (commaIdx === -1) return <span>{authorsYear}{articleTitle}<em>{remainder}</em></span>;
  const journalName = remainder.slice(0, commaIdx);
  const rest = remainder.slice(commaIdx);
  return <span>{authorsYear}{articleTitle}<em>{journalName}</em>{rest}</span>;
}

              </div>
            </div>
            <div className="text-center"><p className="text-white/90 text-sm font-semibold drop-shadow">Showing <strong className="text-white text-lg">{filtered.length}</strong> of {interventions.length} interventions</p></div>
          </div>

          {/* Cards */}
          <div className="flex-1 space-y-6">
            {filtered.length===0 ? (
              <div className="glass rounded-2xl p-12 text-center"><i data-lucide="search-x" className="w-16 h-16 text-gray-400 mx-auto mb-4"></i><p className="text-gray-700 text-lg font-medium mb-2">No interventions found</p><p className="text-gray-600">Try adjusting your filters or search term</p></div>
            ) : filtered.map(iv=>(
              <div key={iv.id} className="glass rounded-2xl shadow-xl hover:shadow-2xl card-hover cursor-pointer border border-white/50" onClick={()=>{setSelectedIntervention(iv.id);setActiveTab('studyDetails');}}>
                <div className="p-8">
                  <h3 className="text-2xl font-bold text-gray-900 mb-3">{iv.title}</h3>
                  <p className="text-gray-700 mb-4 text-lg leading-relaxed">{iv.description}</p>
                  <div className="flex flex-wrap gap-2 mb-4">
                    {iv.tags.gradeLevel.map(t=><span key={t} className="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-medium">{t}</span>)}
                    {iv.tags.subject.map(t=><span key={t} className="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-sm font-medium">{t}</span>)}
                    {iv.tags.country.map(t=><span key={t} className="px-3 py-1 bg-pink-100 text-pink-700 rounded-full text-sm font-medium">{t}</span>)}
                    {iv.tags.deliveryMode.map(t=><span key={t} className="px-3 py-1 bg-orange-100 text-orange-700 rounded-full text-sm font-medium">{t}</span>)}
                  </div>
                  <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full font-bold shadow-lg text-white bg-gradient-to-r from-green-400 to-emerald-500">
                    <i data-lucide="trending-up" className="w-5 h-5"></i>{iv.effectSize}
                    <button className="info-btn" onClick={e=>{e.stopPropagation();setShowEffectInfo(true)}} title="What is effect size?">i</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>

      {/* Effect Size Info Modal */}
      {showEffectInfo && (
        <div className="effect-modal-overlay" onClick={()=>setShowEffectInfo(false)}>
          <div className="effect-modal" onClick={e=>e.stopPropagation()}>
            <button onClick={()=>setShowEffectInfo(false)} style={{position:'absolute',top:'14px',right:'16px',background:'none',border:'none',color:'rgba(255,255,255,0.6)',fontSize:'22px',cursor:'pointer',lineHeight:1}}>&times;</button>
            <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'14px'}}>
              <div style={{background:'#10b981',borderRadius:'10px',padding:'8px',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <i data-lucide="trending-up" style={{width:'20px',height:'20px',color:'white'}}></i>
              </div>
              <h3 style={{fontFamily:"'Merriweather',serif",fontSize:'1.15rem',fontWeight:700,color:'white',margin:0}}>What is effect size?</h3>
            </div>
            <p style={{color:'rgba(255,255,255,0.88)',lineHeight:1.7,fontSize:'0.95rem',margin:'0 0 12px 0'}}>
              <strong style={{color:'white'}}>Effect size</strong> tells you how much students who used the program improved compared to students who did not, measured in standard deviations (SD). Think of it as a standardized ruler for comparing results across very different studies and contexts.
            </p>
            <p style={{color:'rgba(255,255,255,0.88)',lineHeight:1.7,fontSize:'0.95rem',margin:0}}>
              In education research, an effect size of <strong style={{color:'#6ee7b7'}}>0.2 SD</strong> is generally considered meaningful. The studies featured here were selected because they showed positive effects, but the size of the effect still matters for understanding how impactful a program is likely to be in practice.
            </p>
          </div>
        </div>
      )}
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
